name: Publish team country selection
on:
  push:
    paths:
      - '.github/workflows/activate-team-country-editor.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh team editor and match country flags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,a=re.subn(r'src="\./js/team-owner-edit\.js(?:\?[^"]*)?"','src="./js/team-owner-edit.js?v=country-20261106"',s)
          s,b=re.subn(r"import\('\./js/match-detail\.js(?:\?[^']*)?'\)","import('./js/match-detail.js?v=country-20261106')",s)
          if a!=1 or b!=1:raise SystemExit(f'Module references: team {a}, match {b}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Activate country editor and team flags"
          git push
