name: Remove premature player of month
on:
  push:
    paths:
      - '.github/workflows/remove-skrizzi-month.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clear player of month until results exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<b style="font-size:14px">Skrizzi</b>'
          new='<b style="font-size:14px">Пока не выбран</b>'
          if old not in s:
              raise SystemExit('Player of month markup not found')
          s=s.replace(old,new,1)
          s=s.replace('>S</div><div><b style="font-size:14px">Пока не выбран</b>','>?</div><div><b style="font-size:14px">Пока не выбран</b>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove Skrizzi as player of month"
          git push
