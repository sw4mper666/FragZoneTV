name: Apply robust login fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-robust-login-fix.yml']
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix login after successful authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf8')
          old="""else{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;const {data:ban}=await sb.rpc('fztv_my_ban');if(ban){await sb.auth.signOut();throw Error('Аккаунт заблокирован: '+ban.reason)}await refreshAuth()}}catch(err){msg.textContent=err.message}finally{btn.disabled=false}"""
          new="""else{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.session||!data?.user)throw Error('Сервер не вернул сессию. Обнови страницу и попробуй снова.');msg.textContent='Пароль принят. Проверяем профиль…';await refreshAuth();if(!currentUser())throw Error('Авторизация прошла, но профиль не открылся. Обнови страницу.');}}catch(err){const visible=document.getElementById('authMessage');if(visible)visible.textContent=err?.message||'Ошибка подключения к серверу';console.error('FragZoneTV login:',err)}finally{const visible=document.getElementById('authForm')?.querySelector('[type=submit]');if(visible)visible.disabled=false}"""
          assert s.count(old)==1, f'login handler count {s.count(old)}'
          s=s.replace(old,new,1)
          start="async function refreshAuth(){"+chr(10)+"  const {data:{user},error}=await sb.auth.getUser();"
          replacement="async function refreshAuth(){"+chr(10)+"  let authResult;"+chr(10)+"  try { authResult=await sb.auth.getUser(); }"+chr(10)+"  catch(err) { console.error('FragZoneTV session lookup:',err); throw new Error('Не удалось загрузить сессию Supabase: '+(err?.message||'ошибка сети')); }"+chr(10)+"  const {data:{user},error}=authResult;"
          assert s.count(start)==1, f'refreshAuth function count {s.count(start)}'
          s=s.replace(start,replacement,1)
          p.write_text(s,encoding='utf8')
          print('Auth fix complete')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Fix login after Supabase success and show errors' && git push)
