name: Publish FragZoneTV founder profile badge
on:
  push:
    paths:
      - '.github/workflows/activate-founder-profile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust account profile module caches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          content=p.read_text(encoding='utf-8')
          pattern=r"(\./js/account-community\.js)(?:\?[^'\"\s)]*)?"
          content,n=re.subn(pattern,lambda m:m.group(1)+'?v=founder-badge-20261107',content)
          if n<1:
              raise SystemExit('Account module import not found. Aborting.')
          p.write_text(content,encoding='utf-8')
          print('Refreshed account-community imports:',n)
          PY
      - name: Publish versioned homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Publish founder badge on user profiles"
          git push
