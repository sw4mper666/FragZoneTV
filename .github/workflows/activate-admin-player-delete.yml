name: Activate admin player deletion
on:
  push:
    paths:
      - '.github/workflows/activate-admin-player-delete.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect deletion UI and hide deleted legacy players
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function woodsRosterNow(){return teamWoodsRoster.filter(([name])=>{"
          new="function woodsRosterNow(){return teamWoodsRoster.filter(([name])=>{if(window.fztvRemovedPlayers?.has(name.toLowerCase()))return false;"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Woods roster function missing')
          if 'admin-delete-players.js' not in s:
              s=s.replace('</body>','<script src="./js/admin-delete-players.js?v=20261106-1"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable secure admin player deletion"
          git push
