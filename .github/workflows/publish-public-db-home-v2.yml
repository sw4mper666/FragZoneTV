name: Publish public homepage player list update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-public-db-home-v2.yml']
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update script version and check JavaScript
        run: |
          node --check js/fztv-public-data-home.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf8')
          old='fztv-public-data-home.js?v=20261111-db-home-v1'
          new='fztv-public-data-home.js?v=20261111-db-home-v2'
          assert s.count(old)==1, f'Expected one reference: {s.count(old)}'
          p.write_text(s.replace(old,new),encoding='utf8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Show registered player leaderboard and refresh homepage cache' && git push)
