name: Restore original FragZoneTV calendar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-tournament-season.yml'
      - 'js/tournament-season-2027.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove replacement tournament calendar without touching original code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('index.html')
          html=path.read_text(encoding='utf-8')
          original=html
          html,n=re.subn(r'<script[^>]+src=["\x27](?:\./)?js/tournament-season-2027\.js(?:\?[^"\x27]*)?["\x27][^>]*>\s*</script>\s*','',html,flags=re.I)
          print('Removed season script tags:',n)
          if not n and 'tournament-season-2027.js' in html:raise SystemExit('Unexpected calendar reference; abort safely')
          if html!=original:path.write_text(html,encoding='utf-8')
          PY
      - name: Commit restoration
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore original tournament calendar layout"
          git push
