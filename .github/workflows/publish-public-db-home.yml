name: Publish Supabase public homepage data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-public-db-home.yml']
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and add public hydration script
        run: |
          node --check js/fztv-public-data-home.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf8')
          mark='</body></html>'
          tag='<script defer src="./js/fztv-public-data-home.js?v=20261111-db-home-v1"></script>'
          assert s.count(mark)==1
          if tag not in s:s=s.replace(mark,tag+'\n'+mark,1)
          p.write_text(s,encoding='utf8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Publish restored public data homepage and player feeds' && git push)
