name: Publish weekly archive and map statistics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-week-map-stats.yml'
      - 'js/fztv-week-home-archive.js'
      - 'js/fztv-player-map-averages.js'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update page module references without replacing original app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for filename in ['fztv-week-home-archive.js','fztv-player-map-averages.js']:
              tag='<script defer src="./js/'+filename+'?v=20261109-rounded-stats-v1"></script>'
              pattern=r'<script[^>]+src=["\x27](?:\./)?js/'+re.escape(filename)+r'(?:\?[^"\x27]*)?["\x27][^>]*>\s*</script>'
              if re.search(pattern,s,re.I):s=re.sub(pattern,tag,s,count=1,flags=re.I)
              else:
                  if not re.search(r'</body\s*>',s,re.I):raise SystemExit('Missing body closing tag')
                  s=re.sub(r'</body\s*>',lambda m:tag+'\n'+m.group(0),s,count=1,flags=re.I)
          # Update the match renderer import so new per-map stats are not cached out.
          s=re.sub(r'(\./js/match-detail\.js)(?:\?v=[A-Za-z0-9._-]+)?',
                   lambda m:m.group(1)+'?v=20261109-rounded-stats-v1',s)
          # Bust browser caches for existing profile and match modules too.
          for module in ['universal-profiles.js']:
              s=re.sub(r'(\./js/'+re.escape(module)+r')(?:\?v=[A-Za-z0-9._-]+)?',
                       lambda m:m.group(1)+'?v=20261109-rounded-stats-v1',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit updated site
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish homepage weekly archive and match map statistics"
          git push
