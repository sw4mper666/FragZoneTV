name: Build FZTV Anti-Cheat 1.0 for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'anticheat/**'
      - '.github/workflows/build-anticheat.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install client dependencies
        run: python -m pip install --upgrade pip "psutil==6.1.1" "pyinstaller==6.12.0"
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FZTV-AntiCheat-1.0 anticheat/client.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FZTV-AntiCheat-1.0-Windows
          path: dist/FZTV-AntiCheat-1.0.exe
          if-no-files-found: error
