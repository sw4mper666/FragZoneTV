name: Publish connection diagnostic page
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-connection-diagnostics.yml']
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add diagnostics script to page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf8')
          marker='</body></html>'
          tag='<script defer src="./js/connection-diagnostics.js?v=20261111-a"></script>'
          assert s.count(marker)==1
          if tag not in s:s=s.replace(marker,tag+'\n'+marker)
          p.write_text(s,encoding='utf8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Publish safe auth and ranking diagnostic route' && git push)
