name: Stabilize authentication form rendering
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stabilize-auth-form.yml']
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avoid asynchronous replacement of active login form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf8')
          old="app.innerHTML=html;enhanceRankingLayout(route);"
          replacement="""// Background data and session refreshes must not erase the login form while the user types.
          if(route==='auth' && !currentUser() && document.activeElement &&
             document.activeElement.closest('#authForm') && app.querySelector('#authForm')) return;
          app.innerHTML=html;enhanceRankingLayout(route);"""
          assert s.count(old)==1, f'Unexpected render mark count {s.count(old)}'
          s=s.replace(old,replacement,1)
          p.write_text(s,encoding='utf8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Keep login form stable during background refresh' && git push)
