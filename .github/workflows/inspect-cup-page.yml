name: Inspect original FZTV CUP display
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-cup-page.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract referenced sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['cup #1','tournament','fztv-slots','fztv-registration','регистрац','banner','кубок','fztv_tournament']
          rows=s.splitlines(); indexes=set()
          for i,line in enumerate(rows):
              if any(term in line.lower() for term in terms):
                  for j in range(max(0,i-2),min(len(rows),i+3)): indexes.add(j)
          text='\n'.join(f'{i+1}: {rows[i][:1200]}' for i in sorted(indexes))
          Path('cup-page-inspect.txt').write_text(text[:90000],encoding='utf-8')
          PY
      - name: Commit inspection file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cup-page-inspect.txt
          git diff --cached --quiet || (git commit -m "Inspect restored cup registration and banner" && git push)
