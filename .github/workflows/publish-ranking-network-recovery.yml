name: Publish ranking network recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-ranking-network-recovery.yml']
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load ranking re-synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf8')
          mark='</body></html>'
          tag='<script defer src="./js/fztv-ranking-resync.js?v=20261111-restore-team-rp"></script>'
          assert s.count(mark)==1
          if tag not in s:s=s.replace(mark,tag+'\n'+mark,1)
          p.write_text(s,encoding='utf8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Deploy team roster and RP reconnection recovery' && git push)
