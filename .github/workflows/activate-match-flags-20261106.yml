name: Activate published match redesign
on:
  push:
    paths:
      - '.github/workflows/activate-match-flags-20261106.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh match detail module version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"import\('\./js/match-detail\.js(?:\?[^']*)?'\)","import('./js/match-detail.js?v=flags-splitstats-20261106')",s)
          if n != 1:
              raise SystemExit('Expected one match-detail import; found '+str(n))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Publish match detail flags and layout"
          git push
