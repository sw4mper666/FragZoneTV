name: Publish original FZTV CUP trophy and registration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fztv-cup.yml'
      - 'js/fztv-cup-registration-fix.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crop the original trophy from the existing website artwork
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('assets/tournaments/fztv-cup-original.png')
          if not src.exists(): raise SystemExit('Original trophy banner missing; abort')
          im=Image.open(src).convert('RGB')
          if im.width<500 or im.height<200: raise SystemExit('Unexpected source image dimensions')
          left=int(im.width*0.14); right=int(im.width*0.31)
          dst=Path('assets/tournaments/fztv-cup-trophy.png')
          dst.parent.mkdir(parents=True,exist_ok=True)
          im.crop((left,0,right,im.height)).save(dst,optimize=True)
          print('Created front-facing trophy:',dst)
          PY
      - name: Connect CUP display while keeping old calendar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          tag='<script defer src="./js/fztv-cup-registration-fix.js?v=20261108-cup-clean-v3"></script>'
          old=re.compile(r'<script[^>]*src=["\x27](?:\./)?js/fztv-cup-registration-fix\.js(?:\?[^"\x27]*)?["\x27][^>]*>\s*</script>',re.I)
          if old.search(html):html=old.sub(tag,html,count=1)
          else:
            if '</body>' not in html: raise SystemExit('Closing body not found')
            html=html.replace('</body>',tag+'\n</body>',1)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Commit exact restoration patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/tournaments/fztv-cup-trophy.png
          git diff --cached --quiet || (git commit -m 'Publish framed original FZTV CUP trophy and team registration' && git push)