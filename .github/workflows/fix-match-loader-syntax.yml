name: Fix match loader script
on:
  push:
    paths:
      - '.github/workflows/fix-match-loader-syntax.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh module URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"import\('\./js/match-submissions\.js(?:\?[^']*)?'\)","import('./js/match-submissions.js?v=syntax-fixed-20261106')",s)
          if n!=1:raise SystemExit('Expected exactly one match submissions import')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Reload fixed match uploader module"
          git push
