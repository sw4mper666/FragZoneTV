name: Inspect player statistics widget
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-stat-widget.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate gauge stats source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          terms=['УБИЙСТВА','Убийства','убийства','kills','fztvr','fztv-player-gauge']
          results=[]
          for path in [Path('index.html'),*Path('js').glob('*.js')]:
              try: s=path.read_text(encoding='utf-8')
              except: continue
              lines=s.splitlines()
              for i,line in enumerate(lines):
                  if ('убийства' in line.lower() or 'kills' in line.lower()) and ('профил' in s.lower() or 'player' in path.name.lower() or 'profile' in path.name.lower()):
                      if len(line)>20000:
                          results.append(f'{path}:{i+1}: LONG LINE len={len(line)}\n'+line[:5000])
                      else:
                          results.append(f'{path}:{i+1}: '+line[:5000])
          Path('player-stat-widget-inspect.txt').write_text('\n'.join(results)[:85000],encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player-stat-widget-inspect.txt
          git diff --cached --quiet || (git commit -m 'Inspect player kill counters in profiles' && git push)
