name: Fix diagnostics route
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-diagnostics-route.yml']
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve diagnostics page during UI rerenders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf8')
          old="function render(){const route=(location.hash||'#/home').replace(/^#\\/?/,'').split('/')[0];let html;"
          new="function render(){const route=(location.hash||'#/home').replace(/^#\\/?/,'').split('/')[0];if(route==='diagnostics')return;let html;"
          assert s.count(old)==1, f'Expected 1 render entry, found {s.count(old)}'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Keep diagnostics page visible during background render' && git push)
